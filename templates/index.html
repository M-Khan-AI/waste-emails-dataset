<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CleanCity Email Classifier</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 40px 16px; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p.hint { color: #555; margin-top: 0; }
    textarea { width: 100%; height: 200px; padding: 10px; font-size: 1rem; border: 1px solid #ccd; border-radius: 6px; box-sizing: border-box; resize: vertical; }
    button { margin-top: 12px; padding: 10px 22px; font-size: 1rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 20px; padding: 14px; background: #e8f5e9; border-left: 4px solid #43a047; border-radius: 4px; }
    .error { margin-top: 20px; padding: 14px; background: #fdecea; border-left: 4px solid #e53935; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CleanCity Email Classifier</h1>
    <p class="hint">Categories: Missed Pickup, Schedule Change, Complaint, Other.</p>

    <form method="POST" action="/">
      <label for="email_text">Paste the email below:</label><br><br>
      <textarea id="email_text" name="email_text" placeholder="Paste email content here...">{{ email_text }}</textarea>
      <button type="submit">Classify</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    {% if category %}
      <div class="result">Predicted category: <strong>{{ category }}</strong></div>
    {% endif %}
  </div>
</body>
</html>
